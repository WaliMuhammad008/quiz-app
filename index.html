<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pro Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1>🧠 Pro Quiz</h1>
            <p>Advanced level questions with timer & high scores!</p>
            <div class="high-score-board">
                High Score: <span id="high-score-display">0</span>
            </div>
            <button id="start-btn" class="btn primary-btn">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hide">
            <div class="quiz-header">
                <div class="question-count">
                    Question <span id="current-q-num">1</span> of <span id="total-q-num">5</span>
                </div>
                <div class="timer">
                    ⏳ <span id="time-left">15</span>s
                </div>
            </div>
            <div class="progress-bar-container">
                <div id="progress-bar"></div>
            </div>
            <div class="question-container">
                <h2 id="question">Question text goes here?</h2>
                <div id="answer-buttons" class="btn-grid">
                    <!-- Buttons will be injected via JS -->
                </div>
            </div>
            <div class="quiz-footer">
                <button id="next-btn" class="btn primary-btn hide">Next</button>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hide">
            <h2>Quiz Completed! 🎉</h2>
            <div class="score-container">
                <p>Your Score</p>
                <div class="score-circle">
                    <span id="score-text">0/0</span>
                </div>
            </div>
            <p id="feedback-text">Awesome job!</p>
            <button id="restart-btn" class="btn primary-btn">Play Again</button>
        </div>
    </div>
    
    <!-- Confetti JS for celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
